name: tests

on: [push, pull_request]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        docutils-version: ['0.20.1', '0.21.2']
        pytest-version: ['8.4.2', '9.1.1']
        include:
          - pytest-version: '8.4.2'
            pytest-asyncio-version: '1.4.0'
            pytest-rerunfailures-version: '16.4'
          - pytest-version: '9.1.1'
            pytest-asyncio-version: '1.4.0'
            pytest-rerunfailures-version: '16.4'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Every step below runs --no-sync. A plain `uv run` re-syncs the
      # environment to uv.lock first, which would undo these pins and run
      # every matrix leg against the locked versions.
      - name: Install matrix versions
        run: >-
          uv pip install
          "docutils==${{ matrix.docutils-version }}"
          "pytest==${{ matrix.pytest-version }}"
          "pytest-asyncio==${{ matrix.pytest-asyncio-version }}"
          "pytest-rerunfailures==${{ matrix.pytest-rerunfailures-version }}"

      - name: Check dependency consistency
        run: uv pip check

      - name: Print python, pytest and docutils versions
        run: |
          python -V
          uv run --no-sync python -V
          uv run --no-sync pytest --version
          uv run --no-sync python -c 'import docutils; print(docutils.__version__)'

      - name: Lint with ruff check
        run: uv run --no-sync ruff check .

      - name: Format with ruff format
        run: uv run --no-sync ruff format . --check

      - name: Lint with mypy
        run: uv run --no-sync mypy .

      - name: Test with pytest
        run: uv run --no-sync py.test --cov=./ --cov-report=xml

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
      attestations: write

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: uv build

      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
